(function () {

<script>
/* ---------- Deck runtime: model ---------- */
window.Deck = {

  config(o) { Object.assign(this.cfg, o); return this; },
  // the presenter's demo setup (Deck.config({ demo: … })): their answers, read from the launcher before the slides are built,
  // so a slide can say Deck.d('repo', 'your-org/orders-api'). Opened as a plain file (or in --verify) every value is its fallback.

  // sample-code languages: [{id: 'python', name: 'Python'}, ...]. One deck, every code sample in each language; the presenter

      (LG.length > 1 ? '<label>' + (cfg.langLabel ? wbEsc(cfg.langLabel) + ' for the demos' : 'Language of the demo project') + '</label><div class="langs">' + LG.map(l => '<button type="button" data-lang="' + l.id + '" class="' + (l.id === lg ? 'on' : '') + '">' + wbEsc(l.name || l.id) + '</button>').join('') + '</div>' : '') +
      ask.map(k => '<label for="set-' + k + '">' + SETUP_INFO[k][0] + '</label><div class="row"><input type="text" id="set-' + k + '" spellcheck="false" autocomplete="off" value="' + wbEsc(dv[k] || (k === 'sonar' ? 'http://localhost:9000' : '')) + '">' +
        (k === 'repo' || k === 'gitlab' ? '<button type="button" class="b" data-create="' + k + '">Create it in the terminal</button>' : '') + '</div><div class="hint">' + SETUP_INFO[k][1] + '</div>').join('') +
      '<label>Pre-flight check</label><div class="checks"></div>' +
      '<div class="foot"><button type="button" class="b" data-run="1">Check again</button><button type="button" class="b" data-close="1">Close</button><button type="button" class="b go" data-save="1">Save and reload</button></div>';
    setupCheck();
  }
  async function setupCheck() {
    const dm = cfg.demo || {}, box = setupCard.querySelector('.checks'); if (!box) return;
    const lg = (setupCard.querySelector('.langs button.on') || {}).dataset ? setupCard.querySelector('.langs button.on').dataset.lang : D.lang;
    const ask = dm.ask || [];   // everything the setup asks for is checked too
    const list = [...new Set((dm.checks || ['git']).concat(lg && CHECK_NAME[lg] ? [lg] : []).concat(ask.includes('repo') ? ['repo'] : [], ask.includes('gitlab') ? ['glab', 'gitlab'] : [], ask.includes('sonar') ? ['sonar'] : [], ask.includes('kube') ? ['kubectl'] : []))];
    box.innerHTML = list.map(c => '<div class="ck wait" data-ck="' + c + '"><i></i><b>' + CHECK_NAME[c] + '</b><span>checking…</span></div>').join('');
    await Promise.all(list.map(async c => {
      const row = box.querySelector('[data-ck="' + c + '"]'), argEl = setupCard.querySelector('#set-' + (c === 'sonar' || c === 'repo' || c === 'gitlab' ? c : '_'));
      if ((c === 'repo' || c === 'sonar' || c === 'gitlab') && argEl && !argEl.value.trim()) { row.className = 'ck bad'; row.querySelector('span').textContent = 'Not set yet.'; return; }

        const j = await r.json(); row.className = 'ck ' + (j.ok ? 'ok' : 'bad'); row.querySelector('span').textContent = j.ok ? (j.text || 'OK').split('\n')[0] : (j.text ? j.text.split('\n').slice(0, 3).join('\n') + '\n' : '') + 'Fix: ' + CHECK_FIX[c]; }

    }));
  }
  setupCard.addEventListener('click', async e => {

      setupShow(false); termSend((m && m[1] !== 'gitlab.com' ? 'glab repo create ' + m[2] + ' --private --hostname ' + m[1] : 'glab repo create ' + (m ? m[2] : 'my-group/orders-api') + ' --private')); }

    }
  });
  setupEl.addEventListener('click', e => { if (e.target === setupEl) setupShow(false); });

  addEventListener('unhandledrejection', e => { if (e.reason && (e.reason.name === 'Canceled' || e.reason.message === 'Canceled')) e.preventDefault(); });
  kit.workbench = { refresh: () => wbRefresh(), open: path => path ? wbShow(true).then(() => wbOpenFile(path)) : wbShow(true), hide: () => wbShow(false), edit: wbEdit, get available() { return wbKit; } };
  function toast(m) { const n = document.createElement('div'); n.className = 'toast'; n.textContent = m; document.body.append(n); setTimeout(() => n.remove(), 2400); }
  addEventListener('keydown', e => {
    if (e.target && e.target.closest && e.target.closest('#term')) return;   // typing in the terminal: every key is the shell's (Ctrl+` is caught by xterm)
    if (e.target && e.target.closest && e.target.closest('#wb')) return;   // the workbench (editor, explorer) keeps its keys
    if (setupEl.classList.contains('open')) return;   // the demo setup card has the keyboard
    if (termOn && e.code === 'Backquote' && !e.altKey && !e.metaKey && !(e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]'))) { e.preventDefault(); termShow(e.ctrlKey ? null : true); return; }
    if (e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.target && e.target.closest && e.target.closest('.dk-live') && (e.key === ' ' || e.key === 'Enter')) return;   // Space/Enter press the focused control
    const openPick = thPickEl.classList.contains('open') ? thPickEl : lvPickEl.classList.contains('open') ? lvPickEl : lgPickEl.classList.contains('open') ? lgPickEl : null;
    if (openPick) {   // an open picker (theme or level) has the keyboard
      const bs = [...openPick.querySelectorAll('button')], j = bs.indexOf(document.activeElement);
      if (['Escape', 'c', 'C', 'l', 'L', 'g', 'G'].includes(e.key)) { e.preventDefault(); if (openPick === thPickEl) { pickOpen(false); thBtn.focus(); } else if (openPick === lgPickEl) { lgOpen(false); lgBtn.focus(); } else { lvOpen(false); lvBtn.focus(); } }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = bs.length; bs[((j < 0 ? 0 : j + (e.key === 'ArrowDown' ? 1 : -1)) + n) % n].focus(); }

    }
    const k = e.key;
    if ((k === 'ArrowRight' || k === ' ') && e.shiftKey) { e.preventDefault(); finishPart(); }
    else if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); prev(); }
    else if (k === 'Home') go(Math.max(0, nextShown(0, 1))); else if (k === 'End') go(Math.max(0, nextShown(STEPS.length - 1, -1)));
    else if ((k === 'e' || k === 'E') && wbOn) wbShow();
    else if ((k === 'b' || k === 'B') && webOn) { if (webp.classList.contains('open')) panelShow(false); else if (webKit && webSplit) webFull(); else webPickOpen(true); }
    else if ((k === 'h' || k === 'H') && SLIDES && STEPS[step].kind === 'frame') setHidden(STEPS[step].id, !isHidden(STEPS[step].id));

    else if (k === 't' || k === 'T') $('sb').click();
    else if ((k === 'c' || k === 'C') && TH.length > 1) thBtn.click();
    else if ((k === 'l' || k === 'L') && LV.length > 1) lvBtn.click();
    else if ((k === 'g' || k === 'G') && LG.length > 1) lgBtn.click();
    else if (k === 'i' || k === 'I') { indOn = !indOn; indicate(99); toast(indOn ? 'Animation light on' : 'Animation light off'); }
    else if (k === 'f' || k === 'F') fullBtn.click(); else if (k === 'n' || k === 'N') $('nt').click(); else if (k === 's' || k === 'S') $('snd').click(); else if (k === 'k' || k === 'K') pauseAnim(); else if (k === 'r' || k === 'R') replay();
    sleepBar();
  });
  // click a frame (in the overview, or while peeking) to jump to it
  const toldLive = new Set();
  stage.addEventListener('focusin', e => { const fr = e.target.closest && e.target.closest('.dk-frame'); if (!fr || !e.target.closest('.dk-live') || toldLive.has(fr.dataset.id)) return;
    toldLive.add(fr.dataset.id); toast('Using the slide: arrows work the control. Esc gives them back to the slides.'); });
  stage.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('.dk-live, .dk-yt')) return;
    const el = e.target.closest && e.target.closest('.dk-frame'); if (!el) return;
    if (!(peek || STEPS[step].kind === 'overview')) return;
    const i = STEPS.findIndex(s => s.id === el.dataset.id); if (i >= 0) go(i);
  });
  // swipe on touch screens
  let sx = null; addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) (dx < 0 ? next : prev)(); sx = null; });
  // the bar hides while you present, and comes back when the mouse moves
  // The bar stays out of the presentation: keys never show it (they hide it); moving the mouse near the bottom does
  let idle = 0; function wake() { bar.classList.remove('hide'); clearTimeout(idle); idle = setTimeout(() => { if (!bar.matches(':hover')) bar.classList.add('hide'); }, 2600); }
  function sleepBar() { clearTimeout(idle); if (!bar.matches(':hover')) bar.classList.add('hide'); }
  addEventListener('mousemove', e => { if (e.clientY > innerHeight * .78 || bar.matches(':hover')) wake(); }); wake();

  for (const f of F) if (f.anim && f.anim.init) { try { await f.anim.init.call(f.anim, f.k); } catch (err) { f.failed = true; console.error('[frame ' + f.id + ']', err); } }
  for (const f of F) if (f.interactive) {   // live controls (quiz, slider…): own state, not a function of t
    const sc = f.el.querySelector('.dk-scene'); f.ik = Object.assign(Object.create(kit), { stage: f.anim ? sc.appendChild(Object.assign(document.createElement('div'), { style: 'position:absolute;inset:0' })) : sc, W: DW, H: DW * f.h / f.w, frame: f.id });
    try { if (f.interactive.init) await f.interactive.init.call(f.interactive, f.ik); } catch (err) { f.failed = true; console.error('[frame ' + f.id + ']', err); } }
  draw(step, camOf(STEPS[step]), 99, true); cam = camOf(STEPS[step]);
  if (!RENDER) { buildThumbs(); setSide(sideOpen()); indicate(99); }
  ui(); videos(step);

  // Hooks for scripts/render.py
  window.__deck = {
    title: cfg.title, width: W, height: H,
    steps: STEPS.map((s, i) => ({ i, kind: s.kind, id: s.id, k: s.k, label: label(s) })),
    go(i) { step = Math.max(0, Math.min(STEPS.length - 1, i)); anim = null; peek = false; draw(step, camOf(STEPS[step]), 99, true); cam = camOf(STEPS[step]); ui(); videos(step); return true; },
    // step i, camera settled, its scene at t seconds (from arrival, or from the click for a beat)
    play(i, t) { step = Math.max(0, Math.min(STEPS.length - 1, i)); anim = null; peek = false; const B = camOf(STEPS[step]);
      draw(step, B, t, true); cam = B; ui(); videos(step, t); return true; },   // camera settled, the scene t seconds in
    settled() { const vs = F.filter(f => f.vid).map(f => f.vid); if (!vs.length) return Promise.resolve(true);

      interactive: F.filter(f => f.interactive).map(f => ({ id: f.id, failed: !!f.failed, controls: f.el.querySelectorAll('.dk-live button, .dk-live input, .dk-live select, .dk-live [tabindex]').length })) }; },
    slides() { return SL.map(x => ({ id: x.id, i: x.i, label: label({ kind: 'frame', id: x.id, k: 0 }) })); },

      const walker = document.createTreeWalker(f.el, NodeFilter.SHOW_TEXT); let n;
      while ((n = walker.nextNode())) { const t = n.textContent.trim(); if (!t) continue; const el = n.parentElement; if (!el || el.closest('.dk-in[style*="display:none"]')) continue;
        let v = el, hidden = false; while (v && v !== f.el) { const cs = getComputedStyle(v); if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity < .05) { hidden = true; break; } v = v.parentElement; }
        if (hidden) continue; const rg = document.createRange(); rg.selectNodeContents(n); const b = rg.getBoundingClientRect(); if (!b.width) continue;
        const tol = 2; if (b.left < R.left - tol || b.right > R.right + tol || b.top < R.top - tol || b.bottom > R.bottom + tol) { out.push('off the slide: ' + t.slice(0, 40)); continue; }

            if (b.bottom > r.bottom + tol || b.right > r.right + tol || b.top < r.top - tol || b.left < r.left - tol) { out.push('cut off by its box: ' + t.slice(0, 40)); break; } } box = box.parentElement; }
