      p.textContent = (st.fmt === 'gif' ? 'Roughly ' : 'Up to ') + mb(size) + ' · about ' + mins(secs) + (msPerFrame ? '' : ' (measuring…)') + '.' + (st.fmt === 'mp4' && st.fps >= 60 ? ' 30 fps takes ' + (st.fps === 120 ? 'a quarter' : 'about half') + ' as long.' : '') + (st.fps === 120 ? ' 120 fps looks smoother only on 120 Hz screens.' : '') + (st.fmt === 'gif' ? ' GIFs have no sound.' : hasAudio() ? ' Includes the sound (' + [sound() ? sndName() : '', ...tracks.map(x => x.name)].filter(Boolean).join(' + ') + ').' : '');
      form.append(p);
      if (len > 1200) { const w = document.createElement('p'); w.className = 'note warn'; w.textContent = 'Long exports keep this tab busy and need a lot of memory. For films over 20 minutes, export one part at a time, or ask Claude to render the MP4 with scripts/render.py.'; form.append(w); }
      if (st.fmt === 'mp4' && !('VideoEncoder' in window)) { const w = document.createElement('p'); w.className = 'note warn'; w.textContent = 'This browser cannot encode MP4 here. Use Chrome or Edge, or export a GIF.'; form.append(w); }
      const acts = document.createElement('div'); acts.className = 'acts'; const c = document.createElement('button'); c.className = 'btn'; c.textContent = 'Cancel'; c.onclick = close; const go = document.createElement('button'); go.className = 'btn pri'; go.textContent = 'Export'; go.onclick = () => run(); acts.append(c, go); form.append(acts);
    }
    draw();
    if (msPerFrame == null) (async () => { try { await fontsForCapture(); await snap(t); const s0 = performance.now(); await snap(t); await snap(Math.min(DUR, t + .5)); msPerFrame = (performance.now() - s0) / 2 + 8; render(t); if (form.isConnected) draw(); } catch (e) { msPerFrame = 120; } })();
    async function run() {
      let stop = false; d.onclose = () => { stop = true; };
      const was = t; pause();
      form.innerHTML = '<p class="ex-msg" style="margin:0"></p><div class="prog"><i></i></div><p class="note ex-sub" style="margin:0"></p><div class="acts"><button class="btn">Cancel</button></div>';
      const msg = form.querySelector('.ex-msg'), bar = form.querySelector('.prog i'), sub = form.querySelector('.ex-sub');
      form.querySelector('.acts .btn').onclick = () => { stop = true; };
      const prog = (m, p, s) => { msg.textContent = m; bar.style.width = (p * 100).toFixed(1) + '%'; sub.textContent = s || ''; };
      let out;
      try { out = await encode(st, prog, () => stop); }
      catch (e) { t = was; render(t); ui(); if (stop) { close(); toast('Export cancelled.'); return; } console.error('[export]', e); form.innerHTML = '<p class="note warn" style="margin:0"></p><div class="acts"><button class="btn">Close</button></div>'; form.querySelector('.warn').textContent = 'Export failed: ' + (e && e.message || e); form.querySelector('.btn').onclick = close; return; }
      t = was; render(t); ui();
      const u = st.range >= 0 ? UNITS[st.range] : null, name = slug(cfg.title) + (u ? '-' + u.n + '-' + slug(u.name) : '') + '.' + st.fmt;
      form.innerHTML = '<p style="margin:0 0 4px;font-weight:600"></p><p class="note ex-note" style="margin:0"></p><div class="acts"><button class="btn">Close</button><button class="btn pri">Download</button></div>';
      form.querySelector('p').textContent = 'Ready: ' + name + ' · ' + mb(out.blob.size); form.querySelector('.ex-note').textContent = out.note;
      const [cb, db] = form.querySelectorAll('.acts .btn'); cb.onclick = close;
      db.onclick = async () => { db.disabled = true; form.querySelector('.ex-note').textContent = await saveBlob(name, out.blob); db.disabled = false; };
    }
  }
  $('exportBtn').onclick = () => openExport();

  render(t); ui();

  // Hooks for scripts/render.py
  window.__film = {
    duration: DUR, fps: FPS, width: W, height: H, title: cfg.title, scenes: F.scenes.map(s => ({ id: s.id, name: s.name, start: s.$start, dur: s.dur, failed: !!s.$failed })),
    seek(x) { pause(); t = Math.max(0, Math.min(DUR, x)); render(t); ui(); return F.scenes.filter(s => s.$failed).map(s => s.id); },
    async audioWav() {
      const buf = await renderAudio(0, DUR); if (!buf) return null; const bytes = MotionSynth.wav(buf);
      let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s);
    },
    async captureFrame(x) { await fontsForCapture(); const img = await snap(x), c = document.createElement('canvas'); c.width = W; c.height = H; paint(c.getContext('2d'), img, W, H, false); return c.toDataURL('image/png'); },
  };
  window.__filmReady = true;
})();
</script>
